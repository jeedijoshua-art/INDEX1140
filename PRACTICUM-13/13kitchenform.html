<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FEEDME BACK!</title>
    <style>
        body{
            background-color: #F0B9D5;
            border-radius: 5px;
            font-family: 'Times New Roman', Times, serif;
        }
     .div1{
        background-color:gainsboro;   
        padding: 10px;  
        align-content: center;
        justify-content: space-around;
        justify-content: space-evenly;
        grid-template-columns: 1fr 3fr;
        gap: 5px;
        padding: 5px;
        animation: fadeInUp 0.8s ease-out;
        border-radius: 5px;
        }
    @keyframes fadeInUp {
        0% {
            transform: translateY(30px);
            opacity: 0;
        }
        100% {
            transform: translateY(0);
            opacity: 1;
        }
    }

    .item{
        background-color:#EE92C2;
        border:3px solid black;
        padding:10px;
        animation: bounceIn 0.6s ease-out;
        border-radius: 5px;
    }
    .white{
        color:black;
        font-size:x-large;
        text-decoration: underline;
    }
        .feedback{
        background-color: #F0B9D5;
        border: 2px solid black;
        border-radius: 10px;
        padding: 15px;
        margin: 10px 0;
        animation: slideInBox 0.2s ease-out;
        transition: transform 0.5s ease, box-shadow 0.3s ease;
        }
    </style>
</head>
<body>
    <div class="div1">
        <div class="item">
                <h1 class="white"><center><strong>FEEDBACK PLZ!....</strong></center></h1>
            <div class="feedback">
                <form align="center" action="thanksjava.html" method="get" id="feedbackForm">
                        <label for="name">Name:</label>
                        <input type="text"  id="name" placeholder="Enter your name......" required>
                        <br><br>
                        <label for="email">Email:</label>
                        <input type="text" id="email" placeholder="xyz@gmail.com" required>
                        <br><br>
                        <label for="number">Phone Number:</label>
                        <input type="text" id="number" placeholder="9********9">
                        <br><br>
                        <label for="recipe">Your Fav Recipe:</label>
                        <select>
                            <option value="select">Choose</option>
                            <option value="ChickenFry">ChickenFry</option>
                            <option value="Gulab Jamun">Gulab Jamun</option>
                            <option value="Mango Lassi">Mango Lassi</option>
                            <option value="chickenCutlet">Chicken Cutlet</option>
                        </select>
                        <br><br>
                        <label for="button">Would you recommend to others?</label>
                        <input type="radio" id="button" value="YES" name="button">YES
                        <input type="radio" id="button" value="NO" name="button">NO
                        <br><br>
                        <label for="rating">How was the Cooking Level:</label>
                        <select id="rating">
                            <option value="select">Choose</option>
                            <option value="Excellent">Excellent</option>
                            <option value="Good">Good</option>
                            <option value="Not Bad">Not Bad</option>
                            <option value="Average">Average</option>
                            <option value="Very Bad">Very Bad</option>
                        </select>
                        <br><br>
                        <label for="Comment">Few Words about the Webpage:</label><br>
                        <textarea name="message" placeholder="Write Here.." rows="10" cols="30"></textarea>
                        <br><br>
                    <div>
                        <!-- fixed malformed tag and added id for JS onclick -->
                        <input type="submit" id="submitBtn" value="Submit">
                    </div>
                    <div>
                        <input type="reset">
                    </div>
                    <!-- place to show selected rating and thank-you message -->
                    <div id="rating-display" style="margin-top:10px;color:black;font-weight:bold;"></div>
                    <div id="thankyou-message" style="margin-top:10px;color:black;font-weight:bold;"></div>
                </form>
                <div align="center" style="margin-top: 20px;">
                    <a href="momsjava.html" style="background: linear-gradient(45deg, #EE92C2, #F0B9D5); color: black; padding: 12px 20px; border-radius: 25px; text-decoration: none; border: 2px solid black; font-weight: bold;"><strong>← Back to Recipes</strong></a>
                </div>
            </div>
        </div>
    </div> 

<script src="momjava.js"></script> 
</body>
</html>
