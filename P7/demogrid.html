<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CSS Grid Demo</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: Arial, sans-serif;
            background-color: #f5f5f5;
            padding: 20px;
        }

        h2 {
            color: #333;
            margin: 30px 0 15px 0;
        }

        .grid-demo {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 10px;
            margin: 20px 0;
        }

        .grid-item {
            background-color: #4CAF50;
            color: #333;
            padding: 30px;
            text-align: center;
            border-radius: 5px;
            font-weight: bold;
        }

        .grid-demo-2 {
            display: grid;
            grid-template-columns: 1fr 2fr 1fr;
            gap: 10px;
            margin: 20px 0;
        }

        .grid-demo-3 {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            grid-template-rows: repeat(3, 100px);
            gap: 10px;
            margin: 20px 0;
        }

        .grid-item-span {
            background-color: #4CAF50;
            grid-column: span 2;
        }

        .grid-item-area {
            background-color: #4CAF50;
            grid-column: 1 / 3;
            grid-row: 1 / 3;
        }
    </style>
</head>
<body>
    <h2>Basic Grid - 3 Columns</h2>
    <div class="grid-demo">
        <div class="grid-item">1</div>
        <div class="grid-item">2</div>
        <div class="grid-item">3</div>
        <div class="grid-item">4</div>
        <div class="grid-item">5</div>
        <div class="grid-item">6</div>
    </div>

    <h2>Different Column Sizes (1fr 2fr 1fr)</h2>
    <div class="grid-demo-2">
        <div class="grid-item">1fr</div>
        <div class="grid-item">2fr</div>
        <div class="grid-item">1fr</div>
    </div>

    <h2>Grid with Spanning Items</h2>
    <div class="grid-demo-3">
        <div class="grid-item grid-item-area">Spans 2x2</div>
        <div class="grid-item">3</div>
        <div class="grid-item">4</div>
        <div class="grid-item">5</div>
        <div class="grid-item">6</div>
        <div class="grid-item grid-item-span">Spans 2 cols</div>
        <div class="grid-item">8</div>
        <div class="grid-item">9</div>
    </div>
</body>
</html>
