<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Thank You!</title>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;700&display=swap" rel="stylesheet">
    <link href="thankyou.png" rel="icon">
    <style>
        :root {
            --primary: #eeabc4;
            --secondary: #461220;
            --accent: #e76f51;
            --bg: #fff8f0;
            --radius: 18px;
            --shadow: 0 4px 24px #0002;
        }
        body {
            background: linear-gradient(120deg, var(--primary) 60%, var(--bg) 100%);
            font-family: 'Montserrat', Arial, sans-serif;
            margin: 0;
            color: var(--secondary);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .thankyou-card {
            background: var(--bg);
            border-radius: var(--radius);
            box-shadow: var(--shadow);
            padding: 2.5em 2em;
            text-align: center;
            max-width: 450px;
        }
        .thankyou-card img {
            width: 260px;
            height: auto;
            border-radius: 12px;
            box-shadow: 0 2px 12px #0001;
            margin-bottom: 1.2em;
            transition: transform 0.2s;
        }
        .thankyou-card img:hover {
            transform: scale(1.05) rotate(-2deg);
        }
        .thankyou-card h1 {
            font-size: 2em;
            color: var(--secondary);
            margin-bottom: 0.5em;
            letter-spacing: 2px;
        }
        .thankyou-card p {
            font-size: 1.1em;
            color: var(--accent);
            margin-bottom: 1.5em;
        }
        .back-link {
            display: inline-block;
            background: var(--primary);
            color: var(--secondary);
            text-decoration: none;
            font-weight: 700;
            padding: 0.7em 2em;
            border-radius: 8px;
            box-shadow: 0 2px 8px #0001;
            transition: background 0.2s, color 0.2s, transform 0.2s;
        }
        .back-link:hover {
            background: var(--accent);
            color: #fff;
            transform: scale(1.05);
        }
        @media (max-width: 600px) {
            .thankyou-card {
                padding: 1.2em 0.5em;
                max-width: 95vw;
            }
            .thankyou-card img {
                width: 120px;
            }
            .thankyou-card h1 {
                font-size: 1.3em;
            }
        }
    </style>
</head>
<body>
    <div class="thankyou-card">
        <a href="momswithforms.html">
            <img src="thankyou.png" alt="Thank You">
        </a>
        <h1>Thank You For Signing Up!</h1>
        <p>Your registration was successful.<br>
        Click below to return to Lilly's Kitchen recipes.</p>
        <a class="back-link" href="momswithforms.html">Back to Recipes</a>
    </div>
</body>
</html>
