<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>Thank You!</title>
  <style>
    body {
      background: linear-gradient(135deg, #fdf6e3 70%, #bfc593 100%);
      min-height: 100vh;
      font-family: 'Times New Roman', Times, serif;
      display: flex;
      align-items: center;
      justify-content: center;
      margin: 0;
    }
    .thankyou-card {
      background: #f8f5e6;
      color: #556B2F;
      padding: 38px 30px 30px 30px;
      border-radius: 25px;
      box-shadow: 0 8px 32px rgba(85,107,47,.18), 0 2px 8px rgba(85,107,47,.07);
      max-width: 370px;
      width: 94%;
      text-align: center;
      position: relative;
      overflow: hidden;
    }
    .accent-shape {
      position: absolute;
      top: -28px;
      right: -44px;
      width: 110px;
      height: 110px;
      background: #d4deab;
      border-radius: 56% 40% 60% 28% / 40% 40% 60% 60%;
      opacity: .33;
      z-index: 0;
    }
    h1 {
      font-size: 2.5rem;
      letter-spacing: 2px;
      padding-bottom: 7px;
      margin-bottom: 18px;
      text-shadow: 1px 1px 4px #d4deab;
      position: relative;
      z-index: 2;
    }
    .thankyou-message {
      font-size: 1.23rem;
      margin-bottom: 20px;
      position: relative;
      z-index: 2;
    }
    .emoji {
      font-size: 2.2rem;
      display: block;
      margin-bottom: 7px;
    }
    .btn {
      background: #779156;
      color: #f8f5e6;
      font-size: 1rem;
      padding: 0.75em 2em;
      border: none;
      border-radius: 21px;
      box-shadow: 0 2px 8px rgba(85,107,47,.13);
      cursor: pointer;
      transition: background .17s, transform .14s;
      font-family: inherit;
      z-index: 2;
      position: relative;
    }
    .btn:hover {
      background: #556B2F;
      transform: translateY(-2px) scale(1.04);
    }
  </style>
</head>
<body>
  <div class="thankyou-card">
    <div class="accent-shape"></div>
    <h1>Thank You!</h1>
    <div class="thankyou-message">
      Your kindness and support mean so much.<br>
      Wishing you all the best—with gratitude!<br>
      Click Return to go back to the homepage.
    </div>
    <button class="btn" onclick="window.location.href='../../PRACTICUM-6/karuna/Flexkarunya.html'">Return</button>
  </div>
</body>
</html>
