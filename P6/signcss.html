<!DOCTYPE html>
<html lang="en">
<head>
    <title>Sign In - Karunya University</title>
    <link rel="icon" href="karunya.png">
    <!-- Google Fonts: DM Serif Text -->
    <link href="https://fonts.googleapis.com/css?family=DM+Serif+Text&display=swap" rel="stylesheet">
    <style>
        body {
            background-color: #CCDDD3;
            font-family: 'DM Serif Text', serif;
        }
        .container {
            margin-top: 50px;
        }
        table {
            background: #fff;
            border-radius: 10px;
            border: 3px solid #461220;
            padding: 20px;
            box-shadow: 0 4px 16px rgba(0,0,0,0.08);
        }
        td {
            font-size: 22px;
            padding: 10px;
        }
        input[type="text"], input[type="password"] {
            font-family: 'DM Serif Text', serif;
            font-size: 20px;
            padding: 6px;
            width: 95%;
            border-radius: 5px;
            border: 1px solid #ccc;
        }
        input[type="radio"] {
            transform: scale(1.2);
        }
        .btns input {
            font-family: 'DM Serif Text', serif;
            font-size: 22px;
            padding: 8px 30px;
            margin: 0 10px;
            background: #CCDDD3;
            border: 2px solid #461220;
            border-radius: 5px;
            cursor: pointer;
        }
        h1 {
            color: #461220;
            margin-bottom: 20px;
        }
    </style>
</head>
<body>
    <center class="container">
        <h1>Sign In to Karunya University</h1>
        <form action="#" method="post">
            <table cellpadding="8">
                <tr>
                    <td>Name:</td>
                    <td><input type="text" name="name" required></td>
                </tr>
                <tr>
                    <td>Gender:</td>
                    <td>
                        <input type="radio" name="gender" value="male" required> Male&nbsp;&nbsp;&nbsp;
                        <input type="radio" name="gender" value="female"> Female
                    </td>
                </tr>
                <tr>
                    <td>Email:</td>
                    <td><input type="text" name="email" required></td>
                </tr>
                <tr>
                    <td>Password:</td>
                    <td><input type="password" name="password" required></td>
                </tr>
                <tr>
                    <td>Confirm Password:</td>
                    <td><input type="password" name="confirm_password" required></td>
                </tr>
                <tr>
                    <td>Mobile No:</td>
                    <td><input type="text" name="mobile" maxlength="10" required></td>
                </tr>
                <tr>
                    <td colspan="2" align="center" class="btns">
                        <input type="submit" value="Sign In" onclick="window.open('thankkarunya.html')">
                        <input type="reset" value="Reset">
                    </td>
                </tr>
            </table>
        </form>
        <br>
        <font size="5" color="#461220">
            <b>Sign in to know more about Karunya University!</b>
        </font>
    </center>
</body>
</html>
